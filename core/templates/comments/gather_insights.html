{% extends 'comments/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <!-- Page Header -->
            <div class="text-center mb-4">
                <h2 class="display-4">Customize Your Replies</h2>
                <p class="lead">Provide the tone and additional context for automating responses.</p>
            </div>

            <!-- Insights Form -->
            <form method="post" action="{% url 'process_comments' %}">
                {% csrf_token %}
                
                <!-- Tone Selection -->
                <div class="form-group">
                    <label for="insights" class="font-weight-bold">Select the tone for replies:</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-comment-dots"></i></span>
                        </div>
                        <select class="form-control" id="insights" name="insights" required>
                            <option value="" disabled selected>Select tone</option>
                            <option value="Friendly">Friendly</option>
                            <option value="Professional">Professional</option>
                            <option value="Simple">Simple</option>
                            <option value="Humorous">Humorous</option>
                            <!-- Add more options as needed -->
                        </select>
                    </div>
                </div>

                <!-- Additional Context -->
                <div class="form-group">
                    <label for="additional_context" class="font-weight-bold">Additional Context (Optional):</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-edit"></i></span>
                        </div>
                        <textarea class="form-control" id="additional_context" name="additional_context" rows="3" placeholder="Enter any specific instructions or context..."></textarea>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="text-center">
                    <button type="submit" class="btn btn-success btn-lg">
                        <i class="fas fa-paper-plane"></i> Start Automating Comments
                    </button>
                </div>
            </form>

            <!-- View Negative Comments Button -->
            <form method="get" action="{% url 'view_negative_comments' %}" class="mt-4 text-center">
                <button type="submit" class="btn btn-warning btn-lg">
                    <i class="fas fa-exclamation-circle"></i> View Negative Comments
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
